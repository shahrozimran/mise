name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate Expo configuration
        working-directory: apps/mobile
        run: npx expo-doctor
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Test the complete app workflows
        run: npx playwright test
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-evidence
          path: |
            test-results/
            artifacts/*.png
            artifacts/*.pdf
          if-no-files-found: ignore
          retention-days: 7
