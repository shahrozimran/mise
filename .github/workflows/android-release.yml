name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    env:
      CI: "1"
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Validate release version
        id: metadata
        run: node tools/release-info.mjs
      - name: Require a tag on main's history
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install matching Android toolchain
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - run: npm ci
      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      - name: Build ARM64 test APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon --max-workers=2 --console=plain \
            '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m'
      - name: Verify and package download files
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p artifacts
          APK="artifacts/mise-$VERSION-arm64.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$APK"
          python3 tools/check-apk.py "$APK" > artifacts/native-alignment.json
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 4 "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK"
          cd artifacts
          sha256sum "mise-$VERSION-arm64.apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-release
          path: |
            artifacts/*.apk
            artifacts/native-alignment.json
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-release
          path: release
      - name: Verify downloaded APK checksum
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish Android test prerelease
        run: |
          cat > release-notes.md <<EOF
          ## Mise $VERSION

          Offline recipe building, batch macros, interactive preference setup, and personalized meal ideas.

          ### Install
          Download **mise-$VERSION-arm64.apk** below and open it on an ARM64 Android device running Android 7.0 or later. Allow installation from your browser or file manager when Android asks.

          This is a **test build signed with the Android debug certificate**, not a Google Play production build. Native device testing is still required. New USDA searches and paid subscriptions require operator configuration; the bundled catalog and core meal tools work offline.

          The workflow passed TypeScript, lint, domain/API tests, browser workflows, APK signature verification, and 16 KB native/ZIP alignment checks. SHA256SUMS.txt provides the APK checksum.
          EOF
          gh release create "$RELEASE_TAG" \
            "release/mise-$VERSION-arm64.apk" \
            release/SHA256SUMS.txt release/native-alignment.json \
            --verify-tag --prerelease --latest=false \
            --title "Mise $VERSION · Android test build" \
            --notes-file release-notes.md
